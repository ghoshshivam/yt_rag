<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Playlist Search</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1b1f2a; --muted: #6a7285;
    --border: #e1e4ee; --accent: #4f46e5; --accent-soft: #e8e7fd; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c; --card: #1b1e29; --text: #e8eaf2; --muted: #98a0b5;
      --border: #2b3040; --accent: #8b85ff; --accent-soft: #2a2860; --danger: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 320px; padding: 12px 14px; font-size: 1rem; color: var(--text);
         background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  select { padding: 12px; font-size: .95rem; max-width: 100%; color: var(--text);
         background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  button { cursor: pointer; font: inherit; }
  #askBtn { padding: 12px 22px; border: 0; border-radius: 10px; background: var(--accent);
         color: #fff; font-weight: 600; }
  #askBtn:disabled { opacity: .6; cursor: wait; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
  .chip { padding: 6px 12px; font-size: .85rem; color: var(--muted); background: var(--card);
         border: 1px solid var(--border); border-radius: 999px; }
  .chip:hover { color: var(--accent); border-color: var(--accent); }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
         padding: 18px 20px; margin-top: 22px; }
  .panel h2 { margin: 0 0 10px; font-size: 1rem; color: var(--muted); font-weight: 600;
         text-transform: uppercase; letter-spacing: .04em; }
  .answer p { margin: 0 0 10px; }
  .answer ul { margin: 0 0 10px; padding-left: 22px; }
  .answer code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
  a.cite { display: inline-block; min-width: 20px; text-align: center; margin: 0 2px; padding: 0 6px;
         font-size: .78rem; font-weight: 700; text-decoration: none; color: var(--accent);
         background: var(--accent-soft); border-radius: 6px; vertical-align: 1px; }
  .player { aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 10px; margin-top: 4px; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-top: 10px;
         display: flex; gap: 12px; align-items: center; justify-content: space-between; scroll-margin-top: 16px; }
  .card:target { outline: 2px solid var(--accent); }
  .card.cited { border-left: 4px solid var(--accent); }
  .card .t { font-weight: 600; font-size: .95rem; }
  .card .m { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .badge { font-size: .7rem; font-weight: 700; color: var(--accent); background: var(--accent-soft);
         padding: 1px 7px; border-radius: 999px; margin-left: 6px; }
  .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .btns a, .btns button { padding: 7px 12px; font-size: .85rem; text-decoration: none; color: var(--accent);
         background: transparent; border: 1px solid var(--accent); border-radius: 8px; }
  .btns a:hover, .btns button:hover { background: var(--accent-soft); }
  .error { color: var(--danger); }
  .loading { color: var(--muted); }
  @media (max-width: 560px) { .card { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>DSA Playlist Search</h1>
  <p class="sub" id="sub">Ask a question and jump to the exact moment in the lectures.</p>

  <div class="row">
    <input type="text" id="q" placeholder="e.g. Why not use a hashmap for two sum?" autofocus>
    <select id="video"><option value="">All videos</option></select>
    <button id="askBtn">Ask</button>
  </div>
  <div class="chips" id="chips"></div>

  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const EXAMPLES = [
  "Why not use a hashmap for two sum?",
  "How does the two pointer technique work?",
  "What is the time complexity of binary search?",
];

// Render the LLM's plain text: bullets, **bold**, `code`, and [1, 2] citations. Escapes HTML first.
function renderAnswer(text) {
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (m, g) =>
      g.split(',').map(n => `<a class="cite" href="#src-${n.trim()}">${n.trim()}</a>`).join(''));
  let html = '', inList = false;
  for (const raw of esc(text).split('\n')) {
    const line = raw.trim();
    const b = line.match(/^[*-]\s+(.*)/);
    if (b) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(b[1])}</li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      if (line) html += `<p>${inline(line)}</p>`;
    }
  }
  return inList ? html + '</ul>' : html;
}

function videoIdFromUrl(url) {
  try { return new URL(url).searchParams.get('v'); } catch { return null; }
}

function playHere(url, start) {
  const id = videoIdFromUrl(url);
  if (!id) return;
  $('playerBox').innerHTML =
    `<iframe class="player" src="https://www.youtube.com/embed/${id}?start=${Math.floor(start)}&autoplay=1"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  $('playerPanel').hidden = false;
  $('playerPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function ask(question) {
  const btn = $('askBtn');
  btn.disabled = true;
  $('out').innerHTML = '<div class="panel loading">Searching the lectures…</div>';
  try {
    const body = { question };
    if ($('video').value) body.video_id = $('video').value;
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || (res.status === 422 ? 'Please type a longer question.' : 'Request failed'));
    }
    show(await res.json());
  } catch (e) {
    $('out').innerHTML = `<div class="panel error">${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function show(data) {
  const cited = new Set();
  data.answer.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (m, g) => g.split(',').forEach(n => cited.add(+n.trim())));

  const cards = data.sources.map(s => `
    <div class="card ${cited.has(s.n) ? 'cited' : ''}" id="src-${s.n}">
      <div>
        <div class="t">[${s.n}] ${esc(s.title)}${cited.has(s.n) ? '<span class="badge">cited</span>' : ''}</div>
        <div class="m">at ${esc(s.timestamp)} · match ${(s.score * 100).toFixed(0)}%</div>
      </div>
      <div class="btns">
        <button data-url="${esc(s.url)}" data-start="${s.start}" class="play">Play here</button>
        <a href="${esc(s.url)}" target="_blank" rel="noopener">Open on YouTube</a>
      </div>
    </div>`).join('');

  $('out').innerHTML = `
    <div class="panel answer"><h2>Answer</h2>${renderAnswer(data.answer)}</div>
    <div class="panel" id="playerPanel" hidden><h2>Player</h2><div id="playerBox"></div></div>
    <div class="panel"><h2>Sources</h2>${cards || '<p class="loading">No sources found.</p>'}</div>`;

  document.querySelectorAll('.play').forEach(b =>
    b.addEventListener('click', () => playHere(b.dataset.url, +b.dataset.start)));
}

function submit() {
  const q = $('q').value.trim();
  if (q.length < 3) { $('q').focus(); return; }
  ask(q);
}

$('askBtn').addEventListener('click', submit);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

EXAMPLES.forEach(t => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = t;
  b.addEventListener('click', () => { $('q').value = t; submit(); });
  $('chips').appendChild(b);
});

fetch('/videos').then(r => r.json()).then(list => {
  list.sort((a, b) => a.playlist_index - b.playlist_index).forEach(v => {
    const o = document.createElement('option');
    o.value = v.video_id;
    o.textContent = `#${v.playlist_index} ${v.title}`.slice(0, 70);
    $('video').appendChild(o);
  });
}).catch(() => {});

fetch('/health').then(r => r.json()).then(h => {
  if (h.points) $('sub').textContent = `${h.points} moments indexed. Ask a question and jump to the exact point in the lectures.`;
}).catch(() => {});
</script>
</body>
</html>
